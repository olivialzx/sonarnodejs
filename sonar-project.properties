# sonar-project.properties

# Project identification
sonar.projectKey=bkrrajmali_sonarnodejs
sonar.projectName=sonarnodejs
sonar.organization=bkrrajmali

# Source code settings
sonar.sources=src
sonar.sourceEncoding=UTF-8
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Test/coverage settings
sonar.tests=src
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx
sonar.coverage.exclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx
sonar.exclusions=**/node_modules/**,**/coverage/**,**/.next/**,**/dist/**