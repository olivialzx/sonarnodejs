
trigger:
  batch: true
  branches:
    include:
      - main
      - develop
      - feature/*
      - hotfix/*
  paths:
    exclude:
      - '*.md'
      - '.gitignore'
      - 'docs/*'

pr:
  autoCancel: true
  branches:
    include:
      - main
      - develop

variables:
  npm_config_cache: $(Pipeline.Workspace)/.npm
  DOCKER_BUILDKIT: 1
  NODE_VERSION: '20.x'
  VM_IMAGE: 'ubuntu-latest'
- group: NodeJSVariables

stages:
  # 1. Code Validation
  - stage: CodeValidation
    displayName: 'Code Validation'
    jobs:
      - job: Validation
        displayName: 'Code Quality Checks'
        pool:
          vmImage: $(VM_IMAGE)
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: $(NODE_VERSION)
            displayName: 'Install Node.js'

          - script: |
              echo "Verifying package-lock.json..."
              if [ ! -f package-lock.json ]; then
                npm install --package-lock-only --ignore-scripts
              fi
            displayName: 'Verify package-lock.json'

          - task: Cache@2
            inputs:
              key: 'npm | "$(Agent.OS)" | package-lock.json'
              restoreKeys: |
                npm | "$(Agent.OS)"
              path: ~/.npm
            displayName: 'Cache npm modules'

          - script: npm ci --no-audit
            displayName: 'Install Dependencies'

          - script: npx eslint "src/**/*.{ts,tsx}" --max-warnings=0
            displayName: 'Run ESLint'

          - script: |
              echo "Running Prettier formatting check..."
              npx prettier --check "src/**/*.{ts,tsx}" || {
                echo "❌ Prettier formatting issues found."
                exit 1
              }
            displayName: 'Check Prettier Formatting'

  # 2. Basic Security Audit (fast feedback before deeper scans)
  - stage: SecurityAudit
    displayName: 'Security Audit (Pre-Test)'
    dependsOn: CodeValidation
    jobs:
      - job: BasicAudit
        displayName: 'NPM Audit'
        pool:
          vmImage: $(VM_IMAGE)
        steps:
          - script: npm audit --production
            displayName: 'NPM Production Audit'
            continueOnError: true

  # 3. Unit Testing
  - stage: Test
    displayName: 'Unit Tests'
    dependsOn: SecurityAudit
    jobs:
      - job: UnitTests
        pool:
          vmImage: $(VM_IMAGE)
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: $(NODE_VERSION)
            displayName: 'Install Node.js'

          - task: Cache@2
            inputs:
              key: 'npm | "$(Agent.OS)" | package-lock.json'
              restoreKeys: |
                npm | "$(Agent.OS)"
              path: ~/.npm
            displayName: 'Restore npm cache'

          - script: |
              npm ci
              npx vitest run --reporter=junit > test-results.xml
            displayName: 'Run Unit Tests'

          - task: PublishTestResults@2
            inputs:
              testResultsFormat: 'JUnit'
              testResultsFiles: '**/test-results.xml'
              mergeTestResults: true

          - task: PublishCodeCoverageResults@1
            inputs:
              codeCoverageTool: 'Cobertura'
              summaryFileLocation: '$(System.DefaultWorkingDirectory)/coverage/cobertura-coverage.xml'
              reportDirectory: '$(System.DefaultWorkingDirectory)/coverage'

  # 4. SonarCloud Code Quality (requires test coverage)
  - stage: CodeQuality
    displayName: 'Code Quality Analysis'
    dependsOn: Test
    jobs:
      - job: SonarScan
        displayName: 'SonarCloud Analysis'
        pool:
          vmImage: $(VM_IMAGE)
        steps:
          - task: SonarCloudPrepare@1
            inputs:
              SonarCloud: 'sonarnodejs'
              organization: 'bkrrajmali'
              scannerMode: 'CLI'
              projectName: 'sonarnodejs'
              projectKey: 'bkrrajmali_sonarnodejs'
              cliSources: '.'
              extraProperties: |
                sonar.sourceEncoding=UTF-8
                sonar.javascript.lcov.reportPaths=coverage/lcov.info
                sonar.coverage.exclusions=**/*.test.ts,**/*.spec.tsx
                sonar.test.inclusions=**/*.test.ts,**/*.spec.tsx
                sonar.exclusions=**/node_modules/**,**/coverage/**,**/dist/**

          - task: SonarCloudAnalyze@1
          - task: SonarCloudPublish@1
            inputs:
              pollingTimeoutSec: '300'

  # 5. Build App & Docker Image
  - stage: Build
    displayName: 'Build and Containerize'
    dependsOn: CodeQuality
    jobs:
      - job: BuildJob
        displayName: 'Build + Docker'
        pool:
          vmImage: $(VM_IMAGE)
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: $(NODE_VERSION)

          - task: Cache@2
            inputs:
              key: 'npm | "$(Agent.OS)" | package-lock.json'
              restoreKeys: |
                npm | "$(Agent.OS)"
              path: $(npm_config_cache)

          - script: npm ci
            displayName: 'Install Dependencies'

          - script: npm run build
            displayName: 'Build App'

          - task: Docker@2
            inputs:
              containerRegistry: 'dockernode'
              repository: 'devopsnodejs/sonarnodejs'
              command: 'buildAndPush'
              Dockerfile: '**/Dockerfile'

          - task: PublishPipelineArtifact@1
            inputs:
              targetPath: '$(System.DefaultWorkingDirectory)/dist'
              artifact: 'dist'

  # 6. Deep Security: Snyk & Container Vulnerability Scans
  - stage: SecurityScan
    displayName: 'Container & App Security Scans'
    dependsOn: Build
    jobs:
      - job: DeepScan
        displayName: 'Snyk & Container Scans'
        pool:
          vmImage: $(VM_IMAGE)
        steps:
          - script: |
              npm install -g snyk
              snyk auth $(SNYK_TOKEN)
              snyk test
            displayName: 'Snyk App Scan'
            env:
              SNYK_TOKEN: $(SNYK_TOKEN)

          - task: ContainerScan@0
            inputs:
              dockerRegistryServiceConnection: $(dockerRegistryServiceConnection)
              repository: $(imageRepository)
              tag: $(tag)
            displayName: 'Container Vulnerability Scan'


