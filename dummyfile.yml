trigger:
  batch: true
  branches:
    include:
      - main
      - develop
      - feature/*
      - hotfix/*
  paths:
    exclude:
      - '*.md'
      - '.gitignore'
      - 'docs/*'

pr:
  autoCancel: true
  branches:
    include:
      - main
      - develop
variables:
   npm_config_cache: $(Pipeline.Workspace)/.npm
   DOCKER_BUILDKIT: 1
   NODE_VERSION: '20.x'
   VM_IMAGE: 'ubuntu-latest'
-  group: NodeJSVariables
       

stages:
  - stage: CodeValidation
    displayName: Code Validation
    jobs:
      - job: Validation
        displayName: Code Quality Checks
        pool:
          vmImage: $(VM_IMAGE)
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: $(NODE_VERSION)
            displayName: 'Install Node.js'

          - script: |
              echo "Verifying package-lock.json..."
              if [ ! -f package-lock.json ]; then
                npm install --package-lock-only --ignore-scripts
              fi
            displayName: 'Verify package-lock.json'

          - task: Cache@2
            inputs:
              key: 'npm | "$(Agent.OS)" | package-lock.json'
              restoreKeys: |
                npm | "$(Agent.OS)"
              path: ~/.npm
            displayName: 'Cache npm modules'

          - script: npm ci --no-audit
            displayName: 'Install Dependencies'

          - script: npx eslint "src/**/*.{ts,tsx}" --max-warnings=0
            displayName: 'Run ESLint'

          - script: |
              echo "Running Prettier formatting check..."
              npx prettier --check "src/**/*.{ts,tsx}" || {
                echo "❌ Prettier formatting issues found. Run 'npx prettier --write \"src/**/*.{ts,tsx}\"' locally to fix."
                exit 1
              }
            displayName: 'Check Prettier Formatting'

          - script: npm audit --production
            displayName: 'Security Audit'
            continueOnError: true

  - stage: Test
    displayName: Test Stage
    dependsOn: CodeValidation
    jobs:
      - job: UnitTests
        displayName: Run Unit Tests
        pool:
          vmImage: $(VM_IMAGE)
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: $(NODE_VERSION)
            displayName: 'Install Node.js'

          - task: Cache@2
            inputs:
              key: 'npm | "$(Agent.OS)" | package-lock.json'
              restoreKeys: |
                npm | "$(Agent.OS)"
              path: ~/.npm
            displayName: 'Restore npm modules from cache'

          - script: |
              npm ci
              npx vitest run --reporter=junit > test-results.xml
            displayName: 'Run Unit Tests with JUnit Output'

          - task: PublishTestResults@2
            inputs:
              testResultsFormat: 'JUnit'
              testResultsFiles: '**/test-results.xml'
              mergeTestResults: true
              testRunTitle: 'Unit Tests'

          - task: PublishCodeCoverageResults@1
            inputs:
              codeCoverageTool: 'Cobertura'
              summaryFileLocation: '$(System.DefaultWorkingDirectory)/coverage/cobertura-coverage.xml'
              reportDirectory: '$(System.DefaultWorkingDirectory)/coverage'

  - stage: CodeQuality
    displayName: Code Quality Analysis
    jobs:
      - job: SonarQube
        steps:
          - task: SonarCloudPrepare@1
            inputs:
              SonarCloud: 'sonarnodejs'
              organization: 'bkrrajmali'
              scannerMode: 'CLI'
              projectName: 'sonarnodejs'
              projectKey: 'bkrrajmali_sonarnodejs'
              cliSources: '.'
              extraProperties: |
                sonar.sourceEncoding=UTF-8
                sonar.javascript.lcov.reportPaths=coverage/lcov.info
                sonar.coverage.exclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx
                sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx
                sonar.exclusions=**/node_modules/**,**/coverage/**,**/.next/**,**/dist/**

          - task: SonarCloudAnalyze@1

          - task: SonarCloudPublish@1
            displayName: 'Publish SonarCloud Results'
            inputs:
              pollingTimeoutSec: '300'

  - stage: Build
    displayName: 'Build & Test'
    jobs:
      - job: BuildTest
        displayName: 'Build and Test'
        pool:
          vmImage: $(VM_IMAGE)
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: $(NODE_VERSION)
            displayName: 'Install Node.js'

          - task: Cache@2
            inputs:
              key: 'npm | "$(Agent.OS)" | package-lock.json'
              restoreKeys: |
                npm | "$(Agent.OS)"
              path: $(npm_config_cache)
            displayName: 'Cache npm packages'

          - script: npm ci
            displayName: 'Install Dependencies'

          - script: npm run lint
            displayName: 'Run ESLint'
            continueOnError: true

          - script: npm run build
            displayName: 'Build Application'

          - task: Docker@2
            inputs:
             containerRegistry: 'dockernode'
             repository: 'devopsnodejs/sonarnodejs'
             command: 'buildAndPush'
             Dockerfile: '**/Dockerfile'

          - task: PublishPipelineArtifact@1
            inputs:
              targetPath: '$(System.DefaultWorkingDirectory)/dist'
              artifact: 'dist'
              publishLocation: 'pipeline'
            displayName: 'Publish Build Artifacts'
          - task: NodeTool@0
            inputs:
              versionSpec: '20.x'
            displayName: 'Install Node.js'

          - script: |
              npm install -g snyk
              snyk auth $(SNYK_TOKEN)
              snyk test
              snyk container test $(containerRegistry)/$(imageRepository):$(tag)
            displayName: 'Run Snyk Security Scan'
            env:
            SNYK_TOKEN: $(SNYK_TOKEN)

    - task: ContainerScan@0
      inputs:
        dockerRegistryServiceConnection: $(dockerRegistryServiceConnection)
        repository: $(imageRepository)
        tag: $(tag)
      displayName: 'Container Scan'

  - stage: Security
    displayName: 'Security Scan'
    dependsOn: []
    jobs:
      - job: SecurityScan
        displayName: 'Security Scanning'
        pool:
          vmImage: $(VM_IMAGE)
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: $(NODE_VERSION)
            displayName: 'Install Node.js'

          - script: |
              npm install -g npm@latest
              npm audit fix --force || echo "Audit fix applied with warnings"
            displayName: 'NPM Audit Auto-Fix'

          - script: |
              npm audit fix --force || echo "Audit fix applied with warnings"
            displayName: 'NPM Security Audit'
            continueOnError: true

          - task: SnykSecurityScan@1
            inputs:
              serviceConnectionEndpoint: 'Snyk'
              testType: 'app'
              monitorWhen: 'always'
              failOnIssues: false
            displayName: 'Snyk Security Scan'